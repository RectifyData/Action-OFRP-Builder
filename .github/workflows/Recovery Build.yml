name: Recovery Build

on:
  push:
    branches:
      - build/beyond2lte
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        required: true
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/Exynos982x-OrangeFox/android_device_samsung_beyond2lte'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'fox_12.1'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/samsung/beyond2lte'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (if no common tree, leave blank)'
        required: false
        default: 'https://github.com/Exynos982x-OrangeFox/android_device_samsung_exynos9820-common'
      COMMON_PATH:
        description: 'COMMON_PATH (if no common tree, leave blank)'
        required: false
        default: 'device/samsung/exynos9820-common'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'beyond2lte'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        required: true
        default: 'twrp_beyond2lte'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'recovery'

env:
  SYNC_URL: ${{ github.event_name == 'push' && 'https://gitlab.com/OrangeFox/sync.git' || inputs.SYNC_URL }}
  MANIFEST_BRANCH: ${{ github.event_name == 'push' && '12.1' || inputs.MANIFEST_BRANCH }}
  DEVICE_TREE_URL: ${{ github.event_name == 'push' && 'https://github.com/Exynos982x-OrangeFox/android_device_samsung_beyond2lte' || inputs.DEVICE_TREE_URL }}
  DEVICE_TREE_BRANCH: ${{ github.event_name == 'push' && 'fox_12.1' || inputs.DEVICE_TREE_BRANCH }}
  DEVICE_PATH: ${{ github.event_name == 'push' && 'device/samsung/beyond2lte' || inputs.DEVICE_PATH }}
  COMMON_TREE_URL: ${{ github.event_name == 'push' && 'https://github.com/Exynos982x-OrangeFox/android_device_samsung_exynos9820-common' || inputs.COMMON_TREE_URL }}
  COMMON_PATH: ${{ github.event_name == 'push' && 'device/samsung/exynos9820-common' || inputs.COMMON_PATH }}
  DEVICE_NAME: ${{ github.event_name == 'push' && 'beyond2lte' || inputs.DEVICE_NAME }}
  MAKEFILE_NAME: ${{ github.event_name == 'push' && 'twrp_beyond2lte' || inputs.MAKEFILE_NAME }}
  BUILD_TARGET: ${{ github.event_name == 'push' && 'recovery' || inputs.BUILD_TARGET }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
 
    # You might want to Checkout your repo first, but not mandatory
    - name: Check Out
      uses: actions/checkout@v4

    # Cleanup The Actions Workspace Using Custom Composite Run Actions
    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y git python3 tar aria2
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(env.SYNC_URL, 'git@github.com') || 
          startsWith(env.DEVICE_TREE_URL, 'git@github.com') ||
          startsWith(env.COMMON_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone "$SYNC_URL" sync
        cd sync
        ./orangefox_sync.sh --branch "$MANIFEST_BRANCH" --path "${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        mkdir -p "$(dirname "$DEVICE_PATH")"
        git clone --depth 1 --branch "$DEVICE_TREE_BRANCH" "$DEVICE_TREE_URL" "$DEVICE_PATH"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone common tree
      if: |
        env.COMMON_TREE_URL != ''
        && env.COMMON_PATH != ''
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        mkdir -p "$(dirname "$COMMON_PATH")"
        git clone --depth 1 --branch "$DEVICE_TREE_BRANCH" "$COMMON_TREE_URL" "$COMMON_PATH"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install lossless full-partition backup tool
      if: env.DEVICE_NAME == 'beyond2lte'
      run: |
        set -euo pipefail
        recovery_root="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/$COMMON_PATH/recovery/root"
        install -D -m 0755 "$GITHUB_WORKSPACE/tools/foxpart" "$recovery_root/system/bin/foxpart"
        test -s "$recovery_root/system/bin/foxpart"
        echo "Installed foxpart for physical and logical partition backups"

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 4

    - name: Building recovery
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        set -eo pipefail
        export FOX_BUILD_DEVICE="$DEVICE_NAME"
        export ALLOW_MISSING_DEPENDENCIES=true
        if [ "$DEVICE_NAME" = beyond2lte ]; then export FOX_USE_ZSTD_BINARY=1; fi
        set +e
        source build/envsetup.sh
        set -e
        type lunch >/dev/null 2>&1 || { echo 'envsetup did not define lunch'; exit 1; }
        type mka >/dev/null 2>&1 || { echo 'envsetup did not define mka'; exit 1; }
        case "$MAKEFILE_NAME" in *_eng) MAKEFILE_NAME="${MAKEFILE_NAME%_eng}" ;; esac
        case "$MAKEFILE_NAME" in *-eng) LUNCH_TARGET="$MAKEFILE_NAME" ;; *) LUNCH_TARGET="${MAKEFILE_NAME}-eng" ;; esac
        case "$BUILD_TARGET" in
          recovery|recoveryimage) IMAGE_TARGET=recoveryimage; IMAGE_FILE=recovery.img ;;
          boot|bootimage) IMAGE_TARGET=bootimage; IMAGE_FILE=boot.img ;;
          vendorboot|vendorbootimage) IMAGE_TARGET=vendorbootimage; IMAGE_FILE=vendor_boot.img ;;
          *) echo "Unsupported build target: $BUILD_TARGET"; exit 1 ;;
        esac
        lunch "$LUNCH_TARGET"
        mka adbd "$IMAGE_TARGET" -j2
        OUTPUT="out/target/product/$DEVICE_NAME/$IMAGE_FILE"
        if ! test -s "$OUTPUT"; then
          echo "Build completed without required image: $OUTPUT"
          exit 1
        fi
        if [[ "$DEVICE_NAME" == "beyond2lte" && "$IMAGE_FILE" == "recovery.img" ]]; then
          BYTES=$(stat -c '%s' "$OUTPUT")
          if (( BYTES > 67633152 )); then
            echo "Recovery image too large: $BYTES bytes (maximum 67633152)"
            exit 1
          fi
        fi
        if [[ "$DEVICE_NAME" == "beyond2lte" && "$IMAGE_FILE" == "recovery.img" ]]; then
          test -s "out/target/product/$DEVICE_NAME/recovery/root/system/bin/foxpart" || {
            echo 'foxpart was not staged in the recovery ramdisk' >&2
            exit 1
          }
        fi
        echo "Build output validated: $OUTPUT"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Package OrangeFox flashable ZIP and Odin AP TAR
      if: env.DEVICE_NAME == 'beyond2lte' && (env.BUILD_TARGET == 'recovery' || env.BUILD_TARGET == 'recoveryimage')
      run: |
        set -euo pipefail
        image="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/recovery.img"
        output="${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}"
        python3 "$GITHUB_WORKSPACE/tools/package_recovery.py" "$image" "$output" "OrangeFox-R12.0-Unofficial-beyond2lte"
        test -s "$output/OrangeFox-R12.0-Unofficial-beyond2lte-Odin.tar"
        test -s "$output/OrangeFox-R12.0-Unofficial-beyond2lte-flashable.zip"
        (
          cd "$output"
          sha256sum recovery.img *-Odin.tar *-flashable.zip > SHA256SUMS.txt
        )

    - name: Check the output directory before uploading
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: false
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.img
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.zip
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*.tar
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/*SHA256SUMS.txt
        prerelease: true
        name: ${{ env.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ env.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Target: ${{ env.BUILD_TARGET }}
          Backup enhancement: lossless Zstandard or built-in gzip archives of physical and mapped logical partitions through foxpart; untested on hardware.
          Distribution: recovery.img, Odin TAR, flashable ZIP. Images are experimental.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
