name: Test lossless partition archives

on:
  push:
    paths:
      - 'tools/foxpart'
      - 'tests/test_foxpart.sh'
      - '.github/workflows/test-partition-backup.yml'
  pull_request:
    paths:
      - 'tools/foxpart'
      - 'tests/test_foxpart.sh'
      - '.github/workflows/test-partition-backup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y zstd
      - name: Syntax and functional tests
        run: |
          set -e
          sh -n tools/foxpart
          sh -n tests/test_foxpart.sh
          sh tests/test_foxpart.sh
